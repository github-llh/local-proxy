[package]
name = "localproxy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalProxy 菜单栏控制中心（Tauri v2）"

[lib]
name = "localproxy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
localproxy-core = { workspace = true }
localproxy-launcher = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
