[package]
name = "localproxy-shim-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalProxy Windows 注入 shim：DLL 注入 + vendored MinHook"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# 源码整体 #![cfg(windows)]：非 Windows target 上本 crate 为空壳，
# 因此依赖也全部放在 cfg(windows) 下（避免 macOS 上拉取 minhook
# 等仅 Windows 可构建的 crate）。
[target.'cfg(windows)'.dependencies]
localproxy-shim = { workspace = true }
localproxy-net = { workspace = true }
localproxy-inject = { workspace = true }
tracing.workspace = true
minhook = "0.1"
windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
