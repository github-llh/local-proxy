name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀）"
        required: true

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-macos:
    name: 构建 macOS（universal）
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: 构建 universal 二进制
        run: pnpm --dir src-tauri tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          # 未配置证书时产未签名包（用户 xattr -cr 后使用）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: 收集产物
        run: |
          mkdir -p dist
          cp -r src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app dist/ 2>/dev/null || true
          cp -r src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          cd dist && shasum -a 256 * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localproxy-macos
          path: dist/*

  build-windows:
    name: 构建 Windows（x64）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm --dir src-tauri tauri build --bundles msi,nsis
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localproxy-windows
          path: dist/*

  release:
    name: 发布 Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
