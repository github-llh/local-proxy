name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀）"
        required: true

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo test --workspace

  build-macos:
    name: 构建 macOS（universal）
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: 构建 universal 二进制
        run: node scripts/build-bundle.mjs universal-apple-darwin
        env:
          # 未配置证书时使用打包脚本提供的 ad hoc 签名。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: 收集产物
        run: |
          mkdir -p dist
          app=target/universal-apple-darwin/release/bundle/macos/LocalProxy.app
          test -x "$app/Contents/Resources/localproxy-core"
          test -f "$app/Contents/Resources/liblocalproxy_shim_macos.dylib"
          lipo "$app/Contents/MacOS/localproxy-app" -verify_arch arm64 x86_64
          lipo "$app/Contents/Resources/localproxy-core" -verify_arch arm64 x86_64
          lipo "$app/Contents/Resources/liblocalproxy_shim_macos.dylib" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --all-architectures "$app"
          ditto -c -k --keepParent "$app" dist/LocalProxy-universal.app.zip
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localproxy-macos
          path: dist/*

  build-windows:
    name: 构建 Windows（x64）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: node scripts/build-bundle.mjs x86_64-pc-windows-msvc
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist/
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist/
          cd dist && sha256sum *.msi *.exe > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localproxy-windows
          path: dist/*

  release:
    name: 发布 Release
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          fail_on_unmatched_files: true
          files: artifacts/*
          generate_release_notes: true
          draft: false
